<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Персики">
<meta name="theme-color" content="#1a0828">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>🍑 Персики</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%; height: 100dvh; overflow: hidden;
    font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; color: #fff;
    background: #0a0a1a; overscroll-behavior: none; touch-action: manipulation;
  }
  #game {
    position: relative; width: 100%; height: 100dvh;
    display: flex; flex-direction: column;
    background: radial-gradient(ellipse at 50% 0%, #4a2a6a 0%, #2a1240 40%, #150826 100%);
  }
  #game::before {
    content: ''; position: absolute; inset: 0;
    background-image:
      radial-gradient(2px 2px at 20% 30%, #fff8, transparent),
      radial-gradient(1px 1px at 70% 15%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 40% 60%, #fff5, transparent),
      radial-gradient(1px 1px at 85% 45%, #fff7, transparent),
      radial-gradient(2px 2px at 15% 80%, #fff4, transparent),
      radial-gradient(1px 1px at 55% 85%, #fff6, transparent),
      radial-gradient(1.5px 1.5px at 90% 75%, #fff5, transparent);
    pointer-events: none; animation: twinkle 4s ease-in-out infinite alternate;
  }
  @keyframes twinkle { from { opacity: 0.6; } to { opacity: 1; } }

  #top {
    display: flex; gap: 6px; padding: 8px 10px;
    padding-top: calc(8px + env(safe-area-inset-top));
    background: linear-gradient(180deg, #3a1a4a 0%, #2a0f3a 100%);
    border-bottom: 2px solid #ff8ec8;
    box-shadow: 0 4px 20px #ff8ec855, inset 0 -1px 0 #ffb8dd88;
    z-index: 10; align-items: center; flex-wrap: wrap;
  }
  .stat {
    background: linear-gradient(180deg, #4a2558, #2d1338);
    padding: 5px 10px; border-radius: 20px; border: 2px solid #6a3a7a;
    box-shadow: inset 0 1px 0 #ffffff22, 0 2px 6px #0008;
    font-size: 12px; display: flex; align-items: center; gap: 4px; font-weight: bold;
  }
  .stat b { color: #ffd76e; text-shadow: 0 0 8px #ffd76e88; }
  #title {
    margin-left: auto; font-size: 16px; font-weight: 900;
    background: linear-gradient(180deg, #ffd76e, #ff8ec8);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    letter-spacing: 2px;
  }

  #field {
    flex: 1; position: relative; overflow-y: auto; overflow-x: hidden;
    padding: 16px 10px; display: flex; flex-wrap: wrap; gap: 24px 18px;
    align-content: flex-start; justify-content: center;
    -webkit-overflow-scrolling: touch;
  }
  .char {
    position: relative; cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    filter: drop-shadow(0 10px 15px #000a);
    animation: idle 3s ease-in-out infinite; touch-action: manipulation;
  }
  @keyframes idle {
    0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); }
  }
  .char:active { transform: translateY(-8px) scale(1.05); }
  .char.selected { animation: selected 0.6s ease-in-out infinite alternate; }
  @keyframes selected {
    from { filter: drop-shadow(0 10px 15px #000a) drop-shadow(0 0 15px #ffd76e); }
    to { filter: drop-shadow(0 10px 15px #000a) drop-shadow(0 0 30px #ffd76e); }
  }
  .char-svg { display: block; width: 96px; height: 96px; }
  .nameplate {
    position: absolute; bottom: -12px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(180deg, #2a1a3a, #150826);
    border: 2px solid #ff8ec8; border-radius: 20px; padding: 2px 10px;
    font-size: 10px; font-weight: bold; white-space: nowrap;
    box-shadow: 0 4px 10px #0008, inset 0 1px 0 #ffffff33; z-index: 3;
  }
  .nameplate .lvl { color: #ffd76e; }
  .stars {
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 1px; z-index: 3;
  }
  .star { width: 12px; height: 12px; }
  .star svg { width: 100%; height: 100%; display: block; }
  .r1 .star { color: #9aa; } .r2 .star { color: #5fd; }
  .r3 .star { color: #5af; } .r4 .star { color: #c5f; }
  .r5 .star { color: #fa3; } .r6 .star { color: #ff69d8; }
  .mut-badge {
    position: absolute; top: 4px; right: 4px;
    font-size: 14px; z-index: 4;
    filter: drop-shadow(0 0 4px #ffd76e);
  }
  .hpbar {
    position: absolute; top: -10px; left: 50%; transform: translateX(-50%);
    width: 80px; height: 7px; background: #200; border: 2px solid #000;
    border-radius: 6px; overflow: hidden; box-shadow: 0 2px 6px #000a; z-index: 3;
  }
  .hpbar-fill {
    height: 100%; background: linear-gradient(180deg, #ff5b5b, #a01020);
    transition: width 0.4s;
  }
  .dmg {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    font-weight: 900; font-size: 20px; color: #ff4444;
    text-shadow: 0 0 8px #ff0, 2px 2px 0 #000;
    pointer-events: none; animation: dmgFloat 1s ease-out forwards; z-index: 10;
  }
  @keyframes dmgFloat {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
    30% { transform: translate(-50%, -20px) scale(1.3); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }
  .shake { animation: shake 0.4s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px) rotate(-5deg); }
    75% { transform: translateX(8px) rotate(5deg); }
  }

  #bottom {
    background: linear-gradient(180deg, #2a0f3a, #1a0828);
    border-top: 3px solid #ff8ec8;
    box-shadow: 0 -4px 30px #ff8ec855, inset 0 1px 0 #ffb8dd88;
    display: flex; flex-direction: column; padding: 8px 10px;
    padding-bottom: calc(8px + env(safe-area-inset-bottom));
    gap: 6px; z-index: 5; max-height: 52vh;
  }
  #inventoryBar {
    display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px; min-height: 54px;
    -webkit-overflow-scrolling: touch;
  }
  .inv-item {
    flex-shrink: 0;
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #6a3a7a; border-radius: 10px; padding: 4px 6px;
    cursor: pointer; transition: 0.15s;
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; font-weight: bold; touch-action: manipulation;
    position: relative;
  }
  .inv-item.placed { border-color: #ffd76e; box-shadow: 0 0 12px #ffd76e88; }
  .inv-item svg { width: 28px; height: 28px; }
  .inv-item .tag { color: #ffd76e; font-size: 9px; }
  .inv-item .mut { position: absolute; top: -2px; right: -2px; font-size: 12px; }

  #rouletteWrap {
    min-height: 64px; height: 64px; position: relative;
    background: linear-gradient(180deg, #100420, #050210);
    border-radius: 12px; overflow: hidden; border: 3px solid #6a3a7a;
    box-shadow: inset 0 4px 20px #000;
  }
  #rouletteWrap::before, #rouletteWrap::after {
    content: ''; position: absolute; top: 0; bottom: 0; width: 60px;
    z-index: 3; pointer-events: none;
  }
  #rouletteWrap::before { left: 0; background: linear-gradient(90deg, #0a0418 30%, transparent); }
  #rouletteWrap::after { right: 0; background: linear-gradient(-90deg, #0a0418 30%, transparent); }
  #roulette { height: 100%; display: flex; align-items: center; will-change: transform; }
  .slot {
    min-width: 80px; height: 100%; display: flex; align-items: center;
    justify-content: center; flex-shrink: 0;
    border-right: 2px solid #2a1a3a;
  }
  .slot svg { width: 46px; height: 46px; }
  .slot.win { background: radial-gradient(circle, #2a6a3a33, transparent); color: #7fff7f; }
  .slot.lose { background: radial-gradient(circle, #6a2a2a33, transparent); color: #ff7f7f; }
  #pointer {
    position: absolute; top: -4px; bottom: -4px; left: 50%; width: 5px;
    margin-left: -2.5px;
    background: linear-gradient(180deg, #ffd76e, #ff8ec8, #ffd76e);
    box-shadow: 0 0 25px #ffd76e;
    z-index: 6; border-radius: 3px;
  }

  #controls { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btn {
    background: linear-gradient(180deg, #ff9ecc, #d05090);
    color: #2a0820; border: 2px solid #ffd0e8;
    padding: 8px 4px; border-radius: 10px;
    font-weight: 900; cursor: pointer; font-size: 10px;
    text-transform: uppercase;
    transition: 0.1s;
    box-shadow: 0 3px 0 #7a2050, 0 5px 12px #0008;
    touch-action: manipulation; white-space: nowrap; overflow: hidden;
  }
  .btn:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #7a2050; }
  .btn:disabled {
    background: linear-gradient(180deg, #555, #333); color: #888;
    cursor: not-allowed; box-shadow: 0 3px 0 #111; border-color: #666;
  }
  .btn.alt { background: linear-gradient(180deg, #8be0ff, #3080c0); color: #002030; box-shadow: 0 3px 0 #1a4060; }
  .btn.gold {
    background: linear-gradient(180deg, #ffe57a, #d0a020); color: #402000;
    box-shadow: 0 3px 0 #705010;
    grid-column: span 4; font-size: 14px; padding: 10px 6px;
  }
  .btn.auto { background: linear-gradient(180deg, #b0ff99, #40a030); color: #003010; box-shadow: 0 3px 0 #184010; }
  .btn.auto.on { animation: autoPulse 1s ease-in-out infinite alternate; }
  @keyframes autoPulse {
    from { box-shadow: 0 3px 0 #184010, 0 0 10px #b0ff9966; }
    to { box-shadow: 0 3px 0 #184010, 0 0 25px #b0ff99cc; }
  }
  .btn.shop { background: linear-gradient(180deg, #c890ff, #7a40c0); color: #1a0030; box-shadow: 0 3px 0 #4a2080; }
  .btn.pvp { background: linear-gradient(180deg, #ff9090, #c03030); color: #fff; box-shadow: 0 3px 0 #601010; }
  .btn.settings { background: linear-gradient(180deg, #b0b0b0, #606060); color: #fff; box-shadow: 0 3px 0 #303030; }

  #log {
    background: #05020a; border-radius: 8px; padding: 6px 10px;
    font-size: 11px; height: 46px; overflow-y: auto;
    border: 2px solid #3a1a4a;
    font-family: 'Consolas', monospace;
  }
  #log div { margin-bottom: 1px; line-height: 1.3; }
  .win { color: #7fff7f; }
  .lose { color: #ff7f7f; }
  .boss { color: #ffd76e; font-weight: bold; }
  .epic { color: #ff69d8; font-weight: bold; }
  .ach { color: #ffd76e; font-weight: bold; }
  .mut { color: #b0ff99; font-weight: bold; }

  /* Слайдер ставки */
  #betBar {
    display: flex; gap: 6px; align-items: center; justify-content: center;
    background: #1a0828; padding: 4px 8px; border-radius: 10px;
    border: 2px solid #4a2a5a;
  }
  #betBar .lbl { font-size: 11px; color: #ffd76e; font-weight: bold; }
  .bet-btn {
    background: linear-gradient(180deg, #4a2558, #2d1338);
    color: #ffd76e; border: 2px solid #6a3a7a;
    padding: 4px 10px; border-radius: 8px;
    font-weight: bold; font-size: 11px;
    cursor: pointer; touch-action: manipulation;
  }
  .bet-btn.on { background: linear-gradient(180deg, #ffe57a, #d0a020); color: #402000; border-color: #fff5c0; }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(4px);
    display: none; align-items: center; justify-content: center;
    z-index: 100; padding: 12px;
  }
  .modal.on { display: flex; animation: fadeIn 0.2s; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal-box {
    background: linear-gradient(180deg, #2a1840, #150826);
    border: 3px solid #ff8ec8; border-radius: 18px; padding: 16px;
    max-width: 560px; width: 100%; max-height: 100%; overflow-y: auto;
    animation: popIn 0.3s;
    position: relative;
  }
  @keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .modal-box h2 {
    color: #ffd76e; margin-bottom: 10px;
    text-align: center; font-size: 18px; padding-right: 30px;
  }
  .modal-box p { font-size: 12px; color: #bbb; margin-bottom: 12px; text-align: center; }

  .modal-close {
    position: absolute; top: 10px; right: 10px;
    width: 32px; height: 32px;
    background: linear-gradient(180deg, #ff9ecc, #d05090);
    border: 2px solid #ffd0e8; border-radius: 50%;
    color: #2a0820; font-weight: 900; font-size: 16px;
    cursor: pointer; z-index: 5;
    display: flex; align-items: center; justify-content: center;
  }

  .mix-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(94px, 1fr));
    gap: 8px; margin-bottom: 12px;
    max-height: 45vh; overflow-y: auto; padding: 4px;
  }
  .mix-card {
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #4a2a5a; border-radius: 10px; padding: 6px;
    text-align: center; cursor: pointer; transition: 0.15s;
    position: relative;
  }
  .mix-card.sel {
    border-color: #ffd76e; box-shadow: 0 0 20px #ffd76e88;
  }
  .mix-card svg { width: 52px; height: 52px; display: block; margin: 0 auto; }
  .mix-card .n { font-size: 10px; font-weight: bold; margin-top: 2px; color: #ffd0e8; }
  .mix-card .s { font-size: 9px; color: #ffd76e; margin-top: 1px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .row .btn { flex: 1; min-width: 90px; }

  .shop-item {
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #6a3a7a; border-radius: 12px;
    padding: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .shop-item .icon {
    width: 56px; height: 56px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle, #ffb0d0 0%, #d06090 100%);
    border-radius: 12px; border: 2px solid #ffd0e8; font-size: 30px;
  }
  .shop-item .icon.rare { background: radial-gradient(circle, #a8d8ff 0%, #3060c0 100%); border-color: #b0e0ff; }
  .shop-item .icon.myth { background: radial-gradient(circle, #e0b0ff 0%, #7030c0 100%); border-color: #e0c0ff; }
  .shop-item .icon.legend { background: radial-gradient(circle, #ffe57a 0%, #d0a020 100%); border-color: #fff5c0; }
  .shop-item .icon.mega { background: radial-gradient(circle, #ff69d8 0%, #a01080 100%); border-color: #ffb0e0; }
  .shop-item .info { flex: 1; min-width: 0; }
  .shop-item .info h3 { font-size: 14px; color: #ffd76e; margin-bottom: 2px; }
  .shop-item .info p { font-size: 11px; color: #ccc; margin-bottom: 6px; }
  .shop-item .info .chance { font-size: 10px; color: #8f8; }
  .shop-item .info .sale { font-size: 10px; color: #ff69d8; font-weight: bold; }
  .shop-item .buy {
    flex-shrink: 0;
    background: linear-gradient(180deg, #ffe57a, #d0a020);
    color: #402000; border: 2px solid #fff5c0;
    padding: 8px 14px; border-radius: 10px;
    font-weight: 900; font-size: 12px;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 0 #705010;
  }
  .shop-item .buy:disabled {
    background: linear-gradient(180deg, #555, #333); color: #888;
    box-shadow: 0 3px 0 #111; border-color: #666; cursor: not-allowed;
  }

  .up-card {
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #6a3a7a; border-radius: 12px;
    padding: 12px; margin-bottom: 10px;
    display: flex; align-items: center; gap: 12px;
  }
  .up-card svg { width: 64px; height: 64px; flex-shrink: 0; }
  .up-card .info { flex: 1; min-width: 0; }
  .up-card .info h3 { font-size: 13px; color: #ffd76e; margin-bottom: 4px; }
  .up-card .stats { font-size: 11px; color: #ccc; line-height: 1.5; }
  .up-card .stats b { color: #fff; }
  .up-card .actions { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .up-btn {
    background: linear-gradient(180deg, #ffe57a, #d0a020);
    color: #402000; border: 2px solid #fff5c0;
    padding: 5px 10px; border-radius: 8px;
    font-weight: 900; font-size: 10px;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 2px 0 #705010;
  }
  .up-btn:disabled {
    background: linear-gradient(180deg, #555, #333); color: #888;
    box-shadow: 0 2px 0 #111; border-color: #666; cursor: not-allowed;
  }
  .up-btn.p { background: linear-gradient(180deg, #ff9999, #c04040); color: #fff; box-shadow: 0 2px 0 #601818; }
  .up-btn.r { background: linear-gradient(180deg, #99d0ff, #3060c0); color: #fff; box-shadow: 0 2px 0 #1a3060; }
  .up-btn.l { background: linear-gradient(180deg, #b0ff99, #40a030); color: #fff; box-shadow: 0 2px 0 #184010; }

  #flash {
    position: fixed; inset: 0;
    background: radial-gradient(circle, #fff 0%, transparent 70%);
    pointer-events: none; opacity: 0; z-index: 200;
  }
  #flash.go { animation: flash 0.6s; }
  @keyframes flash {
    0% { opacity: 0; } 30% { opacity: 0.7; } 100% { opacity: 0; }
  }
  .coin {
    position: fixed; font-size: 26px; pointer-events: none; z-index: 150;
    animation: coinFly 1.2s ease-out forwards;
  }
  @keyframes coinFly {
    0% { opacity: 1; transform: translate(0,0) scale(0.5); }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.4) rotate(var(--rot)); }
  }
  #resetBtn {
    position: absolute; top: calc(6px + env(safe-area-inset-top)); right: 8px;
    background: #200; border: 2px solid #a03030; color: #f88;
    border-radius: 8px; width: 28px; height: 28px; font-size: 12px;
    cursor: pointer; z-index: 20;
    display: flex; align-items: center; justify-content: center;
    font-weight: bold;
  }
  #saveIndicator {
    position: absolute; top: calc(6px + env(safe-area-inset-top)); right: 42px;
    background: #0a2a0a; border: 2px solid #4a8a4a; color: #8f8;
    border-radius: 8px; padding: 3px 8px;
    font-size: 10px; font-weight: bold; z-index: 20;
    opacity: 0; transition: opacity 0.3s;
  }
  #saveIndicator.on { opacity: 1; }

  #toast {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.8);
    background: linear-gradient(180deg, #ffd76e, #d0a020);
    color: #402000; padding: 14px 26px; border-radius: 14px;
    font-weight: 900; font-size: 16px; z-index: 300;
    opacity: 0; pointer-events: none; transition: 0.3s;
    text-align: center; max-width: 80vw;
  }
  #toast.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }

  .settings-row {
    display: flex; align-items: center; justify-content: space-between;
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #4a2a5a; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .settings-row .label { font-size: 12px; font-weight: bold; color: #ffd0e8; }
  .settings-row .value { font-size: 11px; color: #ffd76e; }
  .toggle {
    width: 46px; height: 26px; border-radius: 13px;
    background: #333; border: 2px solid #555;
    position: relative; cursor: pointer; transition: 0.2s; flex-shrink: 0;
  }
  .toggle.on { background: #4a8a4a; border-color: #6aaa6a; }
  .toggle::after {
    content: ''; position: absolute; top: 1px; left: 1px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; transition: 0.2s;
  }
  .toggle.on::after { transform: translateX(20px); }

  .ach-card {
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #4a2a5a; border-radius: 10px;
    padding: 10px 12px; margin-bottom: 8px;
    opacity: 0.5;
  }
  .ach-card.unlocked { opacity: 1; border-color: #ffd76e; }
  .ach-card .ic {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0;
    background: #2a1830; border: 2px solid #4a2a5a;
  }
  .ach-card.unlocked .ic { background: linear-gradient(180deg, #ffd76e, #d0a020); border-color: #ffe8b0; }
  .ach-card .txt { flex: 1; }
  .ach-card .txt h4 { font-size: 12px; color: #ffd76e; margin-bottom: 2px; }
  .ach-card .txt p { font-size: 10px; color: #bbb; }

  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .stat-box {
    background: linear-gradient(180deg, #3a2048, #1e0e28);
    border: 2px solid #4a2a5a; border-radius: 10px;
    padding: 10px; text-align: center;
  }

const ACHIEVEMENTS = [

  { id:'divine',name:'Божество',desc:'6★ котик',icon:'✨' },

  { id:'rich_10000',name:'Магнат',desc:'10000 монет',icon:'🏦' },
  { id:'rich_100000',name:'Миллионер',desc:'100000 монет',icon:'💎' },
  { id:'cats_10',name:'Коллекционер',desc:'10 котиков',icon:'📚' },

  { id:'cats_50',name:'Хранитель',desc:'50 котиков',icon:'🏛️' },

  { id:'cycle_10',name:'Путешественник',desc:'10 циклов',icon:'🔄' },
  { id:'cycle_50',name:'Странник',desc:'50 циклов',icon:'🌍' },
  { id:'pvp_win',name:'Дуэлянт',desc:'PvP победа',icon:'🎯' },
  { id:'skins_3',name:'Модник',desc:'3 скина',icon:'🎨' },
  { id:'skins_5',name:'Стилист',desc:'5 скинов',icon:'👗' },
  { id:'mutation',name:'Мутант',desc:'Первая мутация',icon:'🧬' },
  { id:'mutations_3',name:'Лаборатория',desc:'3 мутации',icon:'⚗️' },
  { id:'mutations_10',name:'Франкенштейн',desc:'10 мутаций',icon:'🧟' },
  { id:'uroboros',name:'Уроборос',desc:'Победа с шансом <10%',icon:'🐍' },
  { id:'jackpot',name:'Джекпот',desc:'6★ из обычной авоськи',icon:'🎰' },
  { id:'autofarm',name:'Автоматизация',desc:'100 автобоёв',icon:'🤖' },
];

// ============ УТИЛИТЫ ============
const rnd = (a,b) => Math.random()*(b-a)+a;
const rndI = (a,b) => Math.floor(rnd(a,b+1));
const pick = a => a[rndI(0,a.length-1)];
let _id = 0;

function pickRarity(chances) {
  const r = Math.random(); let acc = 0;
  for (const k of Object.keys(chances)) { acc += chances[k]; if (r < acc) return parseInt(k); }
  return 1;
}
function makeCat(rarity, mutations) {
  const r = rarity || pickRarity(BOX_TYPES.basic.chances);
  const base = 5 * r;
  const c = {
    id: ++_id, name: pick(UNIQUE_NAMES), rarity: r,
    power: rndI(base, base+5), resist: rndI(base, base+4),
    luck: rndI(1, base), level: 1,
    mutations: mutations || [],
  };
  return c;
}
function makeThorn(boss) {
  const cycle = state.cycle;
  const scale = 1 + cycle*0.15;
  const base = boss ? rndI(30,45) : rndI(8,20);
  const hpMax = boss ? rndI(80,120) : rndI(30,60);
  return {
    id: ++_id, name: boss?'БОСС':'Шиповник', boss: !!boss,
    power: Math.floor(base*scale),
    spike: Math.floor((boss?rndI(3,6):rndI(1,4))*scale),
    reward: boss?rndI(80,150):rndI(15,35),
    glass: boss?rndI(3,6):(Math.random()<0.3?1:0),
    hp: hpMax, hpMax,
  };
}
function upgradeCost(c, stat) {
  const base = stat==='power'?20:stat==='resist'?15:25;
  const v = stat==='power'?c.power:stat==='resist'?c.resist:c.luck;
  return Math.floor(base*(1+c.level*0.5)*(1+v*0.05));
}

// ============ STATE ============
const SAVE_KEY = 'persiki_save_v3';
function defaultState() {
  return {
    cats: [], thorns: [], placed: [], chosenThorn: null,
    coins: 50, glasses: 0, boxes: 3, cycle: 0,
    rolling: false, lastDailyBonus: 0,
    achievements: {},
    stats: { totalSpins:0,totalWins:0,totalLosses:0,bossesKilled:0,totalCoinsEarned:0,mixesDone:0,cyclesCompleted:0,pvpWins:0,autoBattles:0,mutationsGained:0 },
    skins: { owned:['default'], equipped:'default', customData: null },
    soundOn:true, vibrationOn:true,
    betMultiplier: 1,
    dailyHistory: [], // [{date, coins, wins}]
  };
}
let state = defaultState();

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      cats:state.cats, thorns:state.thorns, placed:state.placed,
      chosenThorn:state.chosenThorn, coins:state.coins,
      glasses:state.glasses, boxes:state.boxes, cycle:state.cycle,
      idCounter:_id, lastDailyBonus:state.lastDailyBonus,
      achievements:state.achievements, stats:state.stats,
      skins:state.skins, soundOn:state.soundOn, vibrationOn:state.vibrationOn,
      betMultiplier:state.betMultiplier, dailyHistory:state.dailyHistory,
    }));
    showSaveIndicator();
  } catch(e) { console.warn('save fail', e); }
}
let saveTimer = null;
function showSaveIndicator() {
  const el = document.getElementById('saveIndicator');
  if (!el) return;
  el.classList.add('on');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => el.classList.remove('on'), 800);
}
function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state.cats = Array.isArray(d.cats) ? d.cats : [];
    state.thorns = Array.isArray(d.thorns) ? d.thorns : [];
    state.placed = Array.isArray(d.placed) ? d.placed : [];
    state.chosenThorn = d.chosenThorn || null;
    state.coins = typeof d.coins === 'number' ? d.coins : 50;
    state.glasses = typeof d.glasses === 'number' ? d.glasses : 0;
    state.boxes = typeof d.boxes === 'number' ? d.boxes : 3;
    state.cycle = typeof d.cycle === 'number' ? d.cycle : 0;
    state.lastDailyBonus = d.lastDailyBonus || 0;
    state.achievements = d.achievements || {};
    state.stats = Object.assign(defaultState().stats, d.stats || {});
    state.skins = Object.assign({ owned:['default'], equipped:'default', customData:null }, d.skins || {});
    state.soundOn = d.soundOn !== false;
    state.vibrationOn = d.vibrationOn !== false;
    state.betMultiplier = d.betMultiplier || 1;
    state.dailyHistory = Array.isArray(d.dailyHistory) ? d.dailyHistory : [];
    _id = d.idCounter || 0;

    // лечим котиков
    state.cats.forEach(c => {
      if (typeof c.power !== 'number') c.power = 5;
      if (typeof c.resist !== 'number') c.resist = 5;
      if (typeof c.luck !== 'number') c.luck = 1;
      if (typeof c.level !== 'number') c.level = 1;
      if (typeof c.rarity !== 'number') c.rarity = 1;
      if (!Array.isArray(c.mutations)) c.mutations = [];
    });
    // лечим шиповников
    state.thorns.forEach(t => {
      if (typeof t.hp !== 'number') t.hp = t.hpMax || 40;
      if (typeof t.hpMax !== 'number') t.hpMax = t.hp;
    });
    // если шипов нет
    if (state.thorns.length === 0) {
      state.cycle++;
      const isBoss = state.cycle % 5 === 0;
      const count = isBoss ? 1 : rndI(2,3);
      for (let i = 0; i < count; i++) state.thorns.push(makeThorn(isBoss));
    }
    return true;
  } catch(e) { console.warn('load fail', e); return false; }
}
function resetGame() {
  if (!confirm('Сбросить ВЕСЬ прогресс?')) return;
  localStorage.removeItem(SAVE_KEY);
  state = defaultState();
  _id = 0;
  document.getElementById('log').innerHTML = '';
  init(); toast('🔄 Сброшено');
}

// ============ ЗВУК ============
let audioCtx = null;
function ac() { if (!audioCtx) { try { audioCtx = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return audioCtx; }
function beep(f,d,t,v) {
  if (!state.soundOn) return;
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = t||'square'; o.frequency.value = f;
  g.gain.setValueAtTime(v||0.05, c.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, c.currentTime + d);
  o.connect(g); g.connect(c.destination);
  o.start(); o.stop(c.currentTime + d);
}
const sfxClick = () => beep(800,0.05,'square',0.04);
const sfxWin = () => { beep(523,0.1); setTimeout(()=>beep(659,0.1),100); setTimeout(()=>beep(784,0.15),200); setTimeout(()=>beep(1047,0.3),350); };
const sfxLose = () => { beep(300,0.15,'sawtooth',0.05); setTimeout(()=>beep(200,0.25,'sawtooth',0.05),150); };
const sfxTick = () => beep(1200,0.02,'square',0.02);
const sfxSpin = () => { for (let i = 0; i < 30; i++) setTimeout(sfxTick, i*(30+i*6)); };
const sfxBuy = () => { beep(600,0.06); setTimeout(()=>beep(900,0.08),60); setTimeout(()=>beep(1200,0.12),140); };
const sfxMut = () => { beep(400,0.1,'sine',0.08); setTimeout(()=>beep(800,0.15,'sine',0.08),100); setTimeout(()=>beep(1200,0.2,'sine',0.08),200); };
function vibrate(ms) { if (state.vibrationOn && navigator.vibrate) navigator.vibrate(ms); }

// ============ UI ============
function log(msg, cls) {
  const el = document.getElementById('log');
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
  while (el.children.length > 60) el.removeChild(el.firstChild);
}
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('on');
  setTimeout(() => t.classList.remove('on'), 1800);
}
function flash() {
  const f = document.getElementById('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
}
function coinBurst(n) {
  n = n || 8;
  const rect = document.getElementById('rouletteWrap').getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  for (let i = 0; i < n; i++) {
    const c = document.createElement('div');
    c.className = 'coin';
    c.textContent = ['💰','🪙','⭐','💎','🍑','✨'][rndI(0,5)];

    document.body.appendChild(c);
    setTimeout(() => c.remove(), 1300);
  }
}

function unlockAch(id) {
  if (state.achievements[id]) return;
  state.achievements[id] = Date.now();
  const a = ACHIEVEMENTS.find(x => x.id === id);
  if (a) { log('🏆 '+a.name+' — '+a.desc, 'ach'); toast('🏆 '+a.name); sfxWin(); }
  saveGame();
}
function checkAchievements() {
  try {
    if (state.cats.length >= 1) unlockAch('first_cat');
    if (state.stats.totalWins >= 1) unlockAch('first_win');
    if (state.stats.totalWins >= 10) unlockAch('wins_10');
    if (state.stats.totalWins >= 50) unlockAch('wins_50');
    if (state.stats.totalWins >= 100) unlockAch('wins_100');
    if (state.stats.totalWins >= 500) unlockAch('wins_500');
    if (state.stats.bossesKilled >= 1) unlockAch('first_boss');
    if (state.stats.bossesKilled >= 5) unlockAch('bosses_5');
    if (state.stats.bossesKilled >= 25) unlockAch('bosses_25');
    if (state.cats.some(c => c.rarity >= 5)) unlockAch('legendary');
    if (state.cats.some(c => c.rarity >= 6)) unlockAch('divine');
    if (state.stats.totalCoinsEarned >= 1000) unlockAch('rich_1000');
    if (state.stats.totalCoinsEarned >= 10000) unlockAch('rich_10000');
    if (state.stats.totalCoinsEarned >= 100000) unlockAch('rich_100000');
    if (state.cats.length >= 10) unlockAch('cats_10');
    if (state.cats.length >= 25) unlockAch('cats_25');
    if (state.cats.length >= 50) unlockAch('cats_50');
    if (state.stats.mixesDone >= 5) unlockAch('mix_5');
    if (state.stats.mixesDone >= 25) unlockAch('mix_25');
    if (state.stats.cyclesCompleted >= 10) unlockAch('cycle_10');
    if (state.stats.cyclesCompleted >= 50) unlockAch('cycle_50');
    if (state.stats.pvpWins >= 1) unlockAch('pvp_win');
    if (state.skins.owned.length >= 3) unlockAch('skins_3');
    if (state.skins.owned.length >= 5) unlockAch('skins_5');
    if (state.stats.mutationsGained >= 1) unlockAch('mutation');
    if (state.stats.mutationsGained >= 3) unlockAch('mutations_3');
    if (state.stats.mutationsGained >= 10) unlockAch('mutations_10');
    if (state.stats.autoBattles >= 100) unlockAch('autofarm');
  } catch(e) {}
}

function togglePlace(id) {

// ============ РУЛЕТКА ============
function buildRoulette(winChance) {
  const slots = [];
  const winCount = Math.round(winChance * 20);
  for (let i = 0; i < 20; i++) slots.push(i < winCount ? 'win' : 'lose');
  for (let i = slots.length - 1; i > 0; i--) {
    const j = rndI(0, i);
    [slots[i], slots[j]] = [slots[j], slots[i]];
  }
  return slots;
}
function spinRoulette(winChance, onDone) {
  const roulette = document.getElementById('roulette');
  const slots = buildRoulette(winChance);
  roulette.innerHTML = slots.map(s =>
    '<div class="slot '+s+'">' + (s==='win'?slotPeachSVG():slotThornSVG()) + '</div>'
  ).join('');

  const slotW = 80;
  const wrapW = document.getElementById('rouletteWrap').clientWidth;
  const centerOffset = wrapW / 2 - slotW / 2;

  const targetWin = Math.random() < winChance;
  let candidates = [];
  slots.forEach((s, i) => { if ((targetWin && s==='win') || (!targetWin && s==='lose')) candidates.push(i); });
  if (candidates.length === 0) slots.forEach((_, i) => candidates.push(i));

  const chosenIdx = candidates[rndI(0, candidates.length-1)];
  const offset = chosenIdx * slotW;
  const targetTransform = centerOffset - offset;

  roulette.style.transition = 'none';
  roulette.style.transform = 'translate3d(0,0,0)';

  // Форсируем reflow и запускаем анимацию
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      roulette.style.transition = 'transform 4s cubic-bezier(0.12, 0.85, 0.2, 1)';
      roulette.style.transform = 'translate3d(' + targetTransform + 'px,0,0)';
    });
  });

  sfxSpin();
  vibrate(30);
  setTimeout(() => onDone(targetWin), 4150);
}

// ============ БОЙ ============
function calcWinChance() {
  const thorn = state.thorns.find(t => t.id === state.chosenThorn);
  if (!thorn) return 0;
  const cats = state.cats.filter(c => state.placed.indexOf(c.id) >= 0);
  let power = 0, luck = 0;
  cats.forEach(c => {
    const m = RARITY[c.rarity].mult * (1 + (c.level-1)*0.2);
    power += c.power * m;
    luck += c.luck * m;
  });
  const eff = power + luck * 0.5;
  const enemyEff = thorn.power + thorn.spike * 2;
  let chance = eff / (eff + enemyEff);
  chance -= thorn.spike * 0.01;
  return Math.max(0.05, Math.min(0.95, chance));
}
function showDamage(el, txt) {
  const d = document.createElement('div');
  d.className = 'dmg'; d.textContent = txt;
  el.appendChild(d);
  setTimeout(() => d.remove(), 1000);
}
function doFight(auto) {
  if (state.rolling) return;
  if (state.placed.length === 0) { if (!auto) log('⚠️ Поставь персика', 'lose'); return; }
  if (!state.chosenThorn) { if (!auto) log('⚠️ Выбери шиповника', 'lose'); return; }
  const thorn = state.thorns.find(t => t.id === state.chosenThorn);
  if (!thorn) return;

  state.rolling = true; renderBottom();
  const chance = calcWinChance();
  if (!auto) log('🎰 Шанс победы ' + (chance*100).toFixed(0) + '% · Ставка x' + state.betMultiplier);
  state.stats.totalSpins++;

  spinRoulette(chance, (win) => {
    state.rolling = false;
    const thornIdx = state.thorns.findIndex(t => t.id === thorn.id);
    const field = document.getElementById('field');
    const thornEl = field.querySelectorAll('.char')[state.placed.length + thornIdx];

    if (win) {
      sfxWin(); flash(); vibrate([40,30,80]);
      const dmgVal = Math.floor(thorn.hpMax * 0.9 + rnd(10, 30));
      thorn.hp = Math.max(0, thorn.hp - dmgVal);
      if (thornEl) {
        thornEl.classList.add('shake');
        showDamage(thornEl, '-' + dmgVal);
        const fill = thornEl.querySelector('.hpbar-fill');
        if (fill) fill.style.width = (thorn.hp / thorn.hpMax * 100) + '%';
      }
      setTimeout(() => { if (thornEl) thornEl.classList.remove('shake'); }, 400);

      if (thorn.hp <= 0) {
        const reward = thorn.reward * state.betMultiplier;
        const glassReward = thorn.glass;
        log('✅ ' + thorn.name + ' побеждён! +' + reward + ' 🪙' + (glassReward?' +'+glassReward+' 🥤':'') + (state.betMultiplier>1?' (x'+state.betMultiplier+')':''), 'win');
        state.coins += reward;
        state.glasses += glassReward;
        state.stats.totalWins++;
        state.stats.totalCoinsEarned += reward;
        // Уроборос
        if (chance < 0.10) unlockAch('uroboros');
        if (thorn.boss) { state.stats.bossesKilled++; toast('👑 БОСС ПОБЕЖДЁН!'); }
        state.thorns = state.thorns.filter(t => t.id !== thorn.id);
        state.chosenThorn = null;
        coinBurst(thorn.boss ? 16 : 8);
        if (state.thorns.length === 0) nextCycle();
      } else {
        log('⚔️ Удар! ' + thorn.name + ' -' + dmgVal + ' HP ('+thorn.hp+'/'+thorn.hpMax+')', 'win');
      }
    } else {
      sfxLose(); vibrate(200);
      state.stats.totalLosses++;
      // Ставка проиграна — теряем монеты
      if (state.betMultiplier > 1) {
        const loss = 10 * state.betMultiplier;
        state.coins = Math.max(0, state.coins - loss);
        log('❌ Промах... потеряно ' + loss + ' 🪙 (ставка x'+state.betMultiplier+')', 'lose');
      } else {
        log('❌ Промах... персики отброшены', 'lose');
      }
      // Шанс потерять котика
      if (Math.random() < 0.25 && state.placed.length > 0) {
        const lostId = state.placed[rndI(0, state.placed.length-1)];
        const idx = state.cats.findIndex(c => c.id === lostId);
        if (idx >= 0) {
          log('💀 ' + state.cats[idx].name + ' убежал с поля', 'lose');
          state.placed.splice(state.placed.indexOf(lostId), 1);
        }
      }
    }
    // История
    recordDailyStats();
    checkAchievements();
    saveGame(); renderAll();
  });
}
function nextCycle() {
  state.cycle++;
  state.stats.cyclesCompleted++;
  const isBoss = state.cycle % 5 === 0;
  log('🔄 Цикл ' + state.cycle + (isBoss?' — БОССФАЙТ! 👑':''), isBoss?'boss':'');
  state.thorns = [];
  const count = isBoss ? 1 : rndI(2,3);
  for (let i = 0; i < count; i++) state.thorns.push(makeThorn(isBoss));
  state.placed = [];
  checkAchievements();
  saveGame(); renderAll();
}

let mixSel = [];
function openMixer() {
  mixSel = [];
  const grid = document.getElementById('mixGrid');
  grid.innerHTML = '';
  if (state.cats.length < 2) grid.innerHTML = '<p style="color:#f77;grid-column:1/-1;text-align:center">Нужно 2+ персика</p>';
  const skin = state.skins.equipped;
  state.cats.forEach(c => {
    const el = document.createElement('div');
    el.className = 'mix-card';
    el.innerHTML = catSVG(c.rarity, false, 52, skin, state.skins.customData) +
      '<div class="n">'+c.name+'</div><div class="s">★'+c.rarity+' · ⚔'+c.power+' · L'+c.level+(c.mutations.length?' '+mutBadges(c):'')+'</div>';
    el.onclick = () => {
      sfxClick();
      const i = mixSel.indexOf(c.id);
      if (i >= 0) mixSel.splice(i,1);
      else if (mixSel.length < 2) mixSel.push(c.id);
      else { mixSel.shift(); mixSel.push(c.id); }
      grid.querySelectorAll('.mix-card').forEach((n, idx) => n.classList.toggle('sel', mixSel.indexOf(state.cats[idx].id)>=0));
      document.getElementById('btnMix').disabled = mixSel.length !== 2;
      document.getElementById('btnFeed').disabled = mixSel.length !== 2;
    };
    grid.appendChild(el);
  });
  document.getElementById('btnMix').disabled = true;
  document.getElementById('btnFeed').disabled = true;
  document.getElementById('modalMixer').classList.add('on');
}
function doMix() {
  if (mixSel.length !== 2) return;
  const a = state.cats.find(c => c.id === mixSel[0]);
  const b = state.cats.find(c => c.id === mixSel[1]);
  if (!a || !b) return;
  const avgRar = (a.rarity + b.rarity) / 2;
  let newRar = Math.round(avgRar);
  if (Math.random() < 0.25) newRar = Math.min(6, newRar + 1);

  // Наследие: берём 75% лучшего стата
  const newPower = Math.max(Math.floor(a.power*0.75), Math.floor(b.power*0.75)) + rndI(1,5);
  const newResist = Math.max(Math.floor(a.resist*0.75), Math.floor(b.resist*0.75)) + rndI(1,3);
  const newLuck = Math.max(Math.floor(a.luck*0.75), Math.floor(b.luck*0.75)) + rndI(1,3);

  const child = makeCat(newRar);
  child.power = newPower;
  child.resist = newResist;
  child.luck = newLuck;
  child.name = a.name.slice(0,4) + b.name.slice(0,4);
  // Наследуем мутации (50% шанс на каждую)
  a.mutations.forEach(m => { if (Math.random() < 0.5 && child.mutations.indexOf(m) < 0) child.mutations.push(m); });
  b.mutations.forEach(m => { if (Math.random() < 0.5 && child.mutations.indexOf(m) < 0) child.mutations.push(m); });
  // 5% шанс на новую мутацию
  let newMut = false;
  if (Math.random() < 0.05) {
    const mutKeys = Object.keys(MUTATIONS).filter(k => child.mutations.indexOf(k) < 0);
    if (mutKeys.length > 0) {
      const m = pick(mutKeys);
      child.mutations.push(m);
      MUTATIONS[m].effect(child);
      state.stats.mutationsGained++;
      newMut = true;
      log('🧬 МУТАЦИЯ! ' + child.name + ' получил "' + MUTATIONS[m].name + '"!', 'mut');
      toast('🧬 ' + MUTATIONS[m].name + '!');
      sfxMut();
    }
  }
  state.cats = state.cats.filter(c => c.id !== a.id && c.id !== b.id);
  state.placed = state.placed.filter(id => id !== a.id && id !== b.id);
  state.cats.push(child);
  state.stats.mixesDone++;
  sfxWin();
  log('🍹 ' + child.name + ' (' + RARITY[child.rarity].name + ', ⚔' + child.power + ')' + (newMut ? ' 🧬' : ''), child.rarity >= 5 ? 'epic' : 'win');
  checkAchievements();
  closeModal('modalMixer');
  saveGame(); renderAll();
}
function doFeed() {
  if (mixSel.length !== 2) return;
  const a = state.cats.find(c => c.id === mixSel[0]);
  const b = state.cats.find(c => c.id === mixSel[1]);
  if (!a || !b) return;
  const gain = Math.floor((b.power + b.resist + b.luck) * 0.5);
  a.level++;
  a.power += Math.floor(gain*0.5);
  a.resist += Math.floor(gain*0.3);
  a.luck += Math.floor(gain*0.2);
  // Наследуем мутации
  b.mutations.forEach(m => { if (a.mutations.indexOf(m) < 0 && Math.random() < 0.5) a.mutations.push(m); });
  state.cats = state.cats.filter(c => c.id !== b.id);
  state.placed = state.placed.filter(id => id !== b.id);
  sfxWin();
  log('🍖 ' + b.name + ' скормлен ' + a.name + '! +'+gain+', L'+a.level, 'win');
  closeModal('modalMixer');
  saveGame(); renderAll();
}

function renderStats() {

      '<div class="stat-box"><div class="v">'+s.autoBattles+'</div><div class="l">Автобоёв</div></div>' +
      '<div class="stat-box"><div class="v">'+Object.keys(state.achievements).length+'/'+ACHIEVEMENTS.length+'</div><div class="l">Ачивок</div></div>' +
      '<div class="stat-box"><div class="v">'+state.skins.owned.length+'/'+Object.keys(SKINS).length+'</div><div class="l">Скинов</div></div>' +
    '</div>';

  // Рисуем график
  const canvas = document.getElementById('chart');
  const rect = canvas.getBoundingClientRect();
  canvas.width = rect.width * window.devicePixelRatio;
  canvas.height = rect.height * window.devicePixelRatio;
  const ctx = canvas.getContext('2d');
  ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  const W = rect.width, H = rect.height;

  // Фон
  ctx.fillStyle = '#0a0418';
  ctx.fillRect(0, 0, W, H);
  // Сетка
  ctx.strokeStyle = '#2a1a3a';
  ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = (H - 30) * i / 4 + 15;
    ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W - 10, y); ctx.stroke();
  }

  const history = state.dailyHistory.slice(-14); // 14 дней
  if (history.length < 2) {
    ctx.fillStyle = '#666'; ctx.font = '12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('Мало данных для графика', W/2, H/2);
    return;
  }
  const maxVal = Math.max(...history.map(h => h.spins), 1);
  const stepX = (W - 40) / (history.length - 1);
  // Линия спинов
  ctx.strokeStyle = '#ffd76e';
  ctx.lineWidth = 2;
  ctx.beginPath();
  history.forEach((h, i) => {
    const x = 30 + i * stepX;
    const y = H - 15 - (h.spins / maxVal) * (H - 30);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.stroke();
  // Точки
  ctx.fillStyle = '#ffd76e';
  history.forEach((h, i) => {
    const x = 30 + i * stepX;
    const y = H - 15 - (h.spins / maxVal) * (H - 30);
    ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI * 2); ctx.fill();
  });
  // Подпись
  ctx.fillStyle = '#ffd76e'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('Спинов по дням (14 дней)', 35, 15);
  ctx.fillStyle = '#888'; ctx.font = '9px sans-serif'; ctx.textAlign = 'right';
  ctx.fillText('макс: ' + maxVal, W - 12, 15);
}

// ============ PVP ============
function encodePvp() {
  const top = state.cats.slice().sort((a,b) => (b.power*RARITY[b.rarity].mult) - (a.power*RARITY[a.rarity].mult)).slice(0,3);
  const payload = { v:1, c: top.map(c => ({n:c.name, r:c.rarity, p:c.power, d:c.resist, l:c.luck, v:c.level})) };
  return btoa(unescape(encodeURIComponent(JSON.stringify(payload))));
}
function decodePvp(code) {
  try {
    const clean = code.trim().replace(/\s+/g, '');
    const d = JSON.parse(decodeURIComponent(escape(atob(clean))));
    if (d.v !== 1 || !Array.isArray(d.c)) return null;
    return d;
  } catch(e) { return null; }
}
function calcTeamPower(team) {
  let p = 0;
  team.forEach(c => {
    const m = RARITY[c.rarity].mult * (1 + (c.level-1)*0.2);
    p += (c.power + c.luck*0.5 + c.resist*0.3) * m;
  });
  return p;
}

      '<div style="color:#ffd0e8;font-weight:bold">'+c.name+'</div>' +
      '<div style="color:#ffd76e">⚔'+c.power+'</div></div>';
  });
  content.innerHTML = '<div style="background:#3a2048;border-radius:12px;padding:12px;margin-bottom:12px">' +
    '<div style="font-size:12px;color:#ffd76e;margin-bottom:6px;font-weight:bold">Твоя команда (топ-3)</div>' +
    '<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">'+teamHtml+'</div></div>' +
    '<div id="pvpResult"></div>';

  const code = encodePvp();
  const content = document.getElementById('pvpContent');
  content.innerHTML = '<div style="background:#3a2048;border-radius:12px;padding:12px">' +
    '<div style="font-size:12px;color:#ffd76e;margin-bottom:6px;font-weight:bold">📤 Твой код вызова</div>' +
    '<textarea class="code-input" id="pvpCodeOut" readonly>'+code+'</textarea>' +
    '<button class="btn gold" id="btnCopyPvp" style="grid-column:auto;font-size:12px">📋 Скопировать</button>' +
    '</div><div id="pvpResult"></div>';
  document.getElementById('btnCopyPvp').onclick = () => {
    const ta = document.getElementById('pvpCodeOut');
    ta.select(); ta.setSelectionRange(0, 99999);
    try { document.execCommand('copy'); toast('✅ Скопировано'); }
    catch(e) { toast('❌ Не удалось'); }
  };
}
function enterPvpCode() {
  const content = document.getElementById('pvpContent');
  content.innerHTML = '<div style="background:#3a2048;border-radius:12px;padding:12px">' +
    '<div style="font-size:12px;color:#ffd76e;margin-bottom:6px;font-weight:bold">📥 Код друга</div>' +
    '<textarea class="code-input" id="pvpCodeIn" placeholder="Вставь код..."></textarea>' +
    '<button class="btn pvp" id="btnFightPvp" style="width:100%">⚔️ СРАЗИТЬСЯ</button>' +
    '</div><div id="pvpResult"></div>';
  document.getElementById('btnFightPvp').onclick = () => {
    const code = document.getElementById('pvpCodeIn').value;
    const enemy = decodePvp(code);
    if (!enemy) { toast('❌ Неверный код'); return; }
    fightPvp(enemy);
  };
}
function fightPvp(enemy) {
  if (state.cats.length === 0) { toast('Нет котиков'); return; }
  const myTop3 = state.cats.slice().sort((a,b) => (b.power*RARITY[b.rarity].mult) - (a.power*RARITY[a.rarity].mult)).slice(0,3);
  const myTeam = myTop3.map(c => ({ rarity:c.rarity, power:c.power, luck:c.luck, resist:c.resist, level:c.level }));
  const myPower = calcTeamPower(myTeam);
  const enemyPower = calcTeamPower(enemy.c);
  let myChance = Math.max(0.05, Math.min(0.95, myPower/(myPower+enemyPower)));
  const result = document.getElementById('pvpResult');
  result.innerHTML = '<div style="background:#3a2048;border-radius:12px;padding:12px">' +
    '<div style="display:flex;justify-content:space-around;font-size:11px;margin-bottom:10px">' +
    '<div style="text-align:center"><div style="color:#8f8;font-weight:bold">ТЫ</div><div style="color:#ffd76e;font-size:16px;font-weight:900">'+Math.round(myPower)+'</div></div>' +
    '<div style="align-self:center;color:#ff69d8;font-size:20px">VS</div>' +
    '<div style="text-align:center"><div style="color:#f88;font-weight:bold">ВРАГ</div><div style="color:#ffd76e;font-size:16px;font-weight:900">'+Math.round(enemyPower)+'</div></div>' +
    '</div><div style="font-size:12px;text-align:center;color:#bbb;margin-bottom:10px">Шанс: <b style="color:#ffd76e">'+(myChance*100).toFixed(0)+'%</b></div>' +
    '<button class="btn gold" id="btnPvpRoll" style="grid-column:auto;font-size:13px">🎰 БРОСИТЬ ВЫЗОВ</button></div>';
  document.getElementById('btnPvpRoll').onclick = () => {
    const win = Math.random() < myChance;
    result.innerHTML = '';
    if (win) {
      sfxWin(); flash(); vibrate([40,30,80]);
      const reward = 50 + Math.floor(enemyPower/10);
      state.coins += reward;
      state.stats.pvpWins++;
      state.stats.totalCoinsEarned += reward;
      log('⚔️ PvP победа! +'+reward+' 🪙', 'win');
      toast('🏆 ПОБЕДА! +'+reward+'🪙');
      coinBurst(12);
      checkAchievements();
    } else {
      sfxLose(); vibrate(200);
      log('⚔️ PvP поражение...', 'lose');
      toast('💀 Поражение');
    }
    saveGame(); renderAll();
    const res = document.createElement('div');
    res.style.cssText = 'text-align:center;padding:16px;font-size:20px;font-weight:900;color:' + (win?'#8f8':'#f88');
    res.textContent = win ? '🏆 ПОБЕДА!' : '💀 Поражение';
    result.appendChild(res);
  };
}

// ============ НАСТРОЙКИ ============
function renderSettings() {
  const el = document.getElementById('settingsContent');
  el.innerHTML =
    '<div class="settings-row"><div><div class="label">🔊 Звук</div><div class="value">Эффекты</div></div><div class="toggle '+(state.soundOn?'on':'')+'" id="tgSound"></div></div>' +
    '<div class="settings-row"><div><div class="label">📳 Вибрация</div><div class="value">На мобильных</div></div><div class="toggle '+(state.vibrationOn?'on':'')+'" id="tgVib"></div></div>' +
    '<div class="settings-row"><div><div class="label">📤 Экспорт</div><div class="value">Скопировать сейв</div></div><button class="btn alt" id="btnExport" style="padding:6px 10px;font-size:11px">Копировать</button></div>' +
    '<div class="settings-row"><div><div class="label">📥 Импорт</div><div class="value">Вставить сейв</div></div><button class="btn alt" id="btnImport" style="padding:6px 10px;font-size:11px">Вставить</button></div>' +
    '<div class="settings-row" style="border-color:#a03030"><div><div class="label" style="color:#f88">🗑 Сброс</div><div class="value">Всё удалится</div></div><button class="btn" id="btnHardReset" style="padding:6px 10px;font-size:11px;background:linear-gradient(180deg,#ff8888,#a03030);color:#fff;box-shadow:0 3px 0 #501010">Сбросить</button></div>' +
    '<div style="font-size:10px;color:#666;text-align:center;margin-top:10px">v7 · Оффлайн · Данные локально</div>';
  document.getElementById('tgSound').onclick = () => { state.soundOn = !state.soundOn; saveGame(); renderSettings(); if (state.soundOn) sfxClick(); };
  document.getElementById('tgVib').onclick = () => { state.vibrationOn = !state.vibrationOn; saveGame(); renderSettings(); if (state.vibrationOn) vibrate(50); };
  document.getElementById('btnExport').onclick = () => {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      const ta = document.createElement('textarea');
      ta.value = raw; document.body.appendChild(ta);
      ta.select(); document.execCommand('copy'); ta.remove();
      toast('✅ Сейв скопирован');
    } catch(e) { toast('❌ Ошибка'); }
  };
  document.getElementById('btnImport').onclick = () => {
    const txt = prompt('Вставь строку сейва:');
    if (!txt) return;
    try {
      JSON.parse(txt);
      localStorage.setItem(SAVE_KEY, txt);
      toast('✅ Загружено, перезагрузка...');
      setTimeout(() => location.reload(), 800);
    } catch(e) { toast('❌ Неверный формат'); }
  };
  document.getElementById('btnHardReset').onclick = resetGame;
}
function openSettings() { renderSettings(); document.getElementById('modalSettings').classList.add('on'); }

// ============ ПРОДАЖА / БОНУС ============
function sellUnplaced() {
  const toSell = state.cats.filter(c => state.placed.indexOf(c.id) < 0);
  if (toSell.length === 0) { log('💤 Нечего продавать'); return; }
  let sum = 0;
  toSell.forEach(c => sum += c.rarity * 10 + c.power + c.resist + c.luck);
  state.cats = state.cats.filter(c => state.placed.indexOf(c.id) >= 0);
  state.coins += sum;
  state.stats.totalCoinsEarned += sum;
  sfxWin();
  log('💰 Продано ' + toSell.length + ' за ' + sum + ' 🪙', 'win');
  checkAchievements();
  saveGame(); renderAll();
}
function checkDailyBonus() {
  const now = Date.now(), DAY = 24*60*60*1000;
  if (now - state.lastDailyBonus >= DAY) {
    state.coins += 100; state.boxes += 2;
    state.stats.totalCoinsEarned += 100;
    state.lastDailyBonus = now;
    saveGame();
    setTimeout(() => {
      toast('🎁 Бонус: +100🪙 +2📦');
      log('🎁 Ежедневный бонус! +100🪙 +2📦', 'epic');
    }, 500);
  }
}

// ============ ЗАКРЫТИЕ МОДАЛОК ============
function closeModal(id) {
  const m = document.getElementById(id);
  if (m) m.classList.remove('on');
}
document.addEventListener('click', (e) => {
  const closeBtn = e.target.closest('.modal-close');
  if (closeBtn) { closeModal(closeBtn.dataset.close); return; }
  if (e.target.classList.contains('modal')) e.target.classList.remove('on');
});

// ============ СТАРТ ============
function init() {
  for (let i = 0; i < 3; i++) state.cats.push(makeCat(1));
  state.thorns.push(makeThorn(false));
  state.thorns.push(makeThorn(false));
  state.placed = [state.cats[0].id];
  // Автовыбор первого шипа (чтобы не было бага «сначала выбери шиповника»)
  state.chosenThorn = state.thorns[0].id;
  log('🍑 Добро пожаловать!', 'boss');
  log('Тапни шиповника, потом жми КРУТИТЬ');
  log('⚡ АВТО — автоматический бой');
  log('🎯 Ставка x2/x5/x10 — риск и награда');
  renderAll();
}

function boot() {
  const loaded = loadGame();
  if (!loaded) init();
  else {
    log('💾 Прогресс загружен', 'win');
    // Автовыбор шипа если не выбран
    if (!state.chosenThorn && state.thorns.length > 0) state.chosenThorn = state.thorns[0].id;
    renderAll();
  }
  checkDailyBonus();

  document.getElementById('btnSpin').onclick = () => doFight(false);
  document.getElementById('btnAuto').onclick = toggleAuto;
  document.getElementById('btnShop').onclick = () => { sfxClick(); openShop(); };
  document.getElementById('btnUpgrade').onclick = () => { sfxClick(); openUpgrade(); };
  document.getElementById('btnMixer').onclick = () => { sfxClick(); openMixer(); };
  document.getElementById('btnBoxes').onclick = openStockBoxes;
  document.getElementById('btnPvp').onclick = () => { sfxClick(); openPvp(); };
  document.getElementById('btnSkins').onclick = () => { sfxClick(); openSkins(); };
  document.getElementById('btnAchievements').onclick = () => { sfxClick(); openAchievements(); };
  document.getElementById('btnStats').onclick = () => { sfxClick(); openStats(); };
  document.getElementById('btnSettings').onclick = () => { sfxClick(); openSettings(); };
  document.getElementById('btnMix').onclick = doMix;
  document.getElementById('btnFeed').onclick = doFeed;
  document.getElementById('btnCreatePvp').onclick = createPvpCode;
  document.getElementById('btnEnterPvp').onclick = enterPvpCode;
  document.getElementById('resetBtn').onclick = resetGame;

  // Ставки
  document.querySelectorAll('.bet-btn').forEach(b => {
    b.onclick = () => {
      sfxClick();
      state.betMultiplier = parseInt(b.dataset.bet);
      saveGame(); renderBottom();
    };
  });

  document.addEventListener('keydown', e => {
    if (e.key === 's' || e.key === 'ы') sellUnplaced();
    if (e.key === 'Escape') {
      ['modalMixer','modalShop','modalUpgrade','modalAchievements','modalStats','modalSkins','modalPvp','modalSettings'].forEach(closeModal);
    }
  });

  window.addEventListener('beforeunload', saveGame);
  document.addEventListener('visibilitychange', () => { if (document.hidden) saveGame(); });
  document.addEventListener('touchstart', () => { ac(); }, { once: true });
  document.addEventListener('click', () => { ac(); }, { once: true });

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW fail', e));
    });
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
</script>
</body>
</html>

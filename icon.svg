  <path d="M256 165 Q285 100 340 80 Q315 130 275 165 Z" fill="url(#leaf)" stroke="#2a6020" stroke-width="4"/>
  <line x1="256" y1="165" x2="256" y2="120" stroke="#2a6020" stroke-width="5"/>

